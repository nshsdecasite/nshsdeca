<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="45" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a2e">SMART Goals</text>

  <g>
    <rect x="60" y="90" width="680" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="110" cy="125" r="26" fill="#1565c0"/>
    <text x="110" y="133" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">S</text>
    <text x="155" y="120" font-size="15" font-weight="700" fill="#1565c0">Specific</text>
    <text x="155" y="142" font-size="12" fill="#333">Clearly define exactly what is to be accomplished.</text>
  </g>

  <g>
    <rect x="60" y="170" width="680" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="110" cy="205" r="26" fill="#2e7d32"/>
    <text x="110" y="213" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">M</text>
    <text x="155" y="200" font-size="15" font-weight="700" fill="#2e7d32">Measurable</text>
    <text x="155" y="222" font-size="12" fill="#333">Include criteria to track progress and know when it's met.</text>
  </g>

  <g>
    <rect x="60" y="250" width="680" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <circle cx="110" cy="285" r="26" fill="#e65100"/>
    <text x="110" y="293" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">A</text>
    <text x="155" y="280" font-size="15" font-weight="700" fill="#e65100">Achievable</text>
    <text x="155" y="302" font-size="12" fill="#333">Realistic given available resources and constraints.</text>
  </g>

  <g>
    <rect x="60" y="330" width="680" height="70" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <circle cx="110" cy="365" r="26" fill="#c62828"/>
    <text x="110" y="373" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">R</text>
    <text x="155" y="360" font-size="15" font-weight="700" fill="#c62828">Relevant</text>
    <text x="155" y="382" font-size="12" fill="#333">Aligned with broader objectives and worth achieving.</text>
  </g>

  <g>
    <rect x="60" y="410" width="680" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <circle cx="110" cy="445" r="26" fill="#6a1b9a"/>
    <text x="110" y="453" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">T</text>
    <text x="155" y="440" font-size="15" font-weight="700" fill="#6a1b9a">Time-bound</text>
    <text x="155" y="462" font-size="12" fill="#333">Has a clear deadline or target date.</text>
  </g>

  <text x="400" y="530" font-size="13" text-anchor="middle" fill="#888">A framework for setting clear, actionable goals.</text>
</svg>
