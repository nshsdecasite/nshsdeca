<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="45" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a2e">Supply and Demand</text>

  <line x1="100" y1="500" x2="700" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="500" x2="100" y2="90" stroke="#333" stroke-width="2"/>
  <text x="400" y="540" font-size="14" text-anchor="middle" fill="#333">Quantity</text>
  <text x="55" y="295" font-size="14" fill="#333" transform="rotate(-90 55 295)">Price</text>

  <!-- demand curve (downward) -->
  <line x1="130" y1="130" x2="650" y2="470" stroke="#c62828" stroke-width="3"/>
  <text x="640" y="460" font-size="15" font-weight="700" fill="#c62828">Demand</text>

  <!-- supply curve (upward) -->
  <line x1="150" y1="470" x2="620" y2="130" stroke="#2e7d32" stroke-width="3"/>
  <text x="600" y="120" font-size="15" font-weight="700" fill="#2e7d32">Supply</text>

  <!-- equilibrium point -->
  <circle cx="385" cy="300" r="7" fill="#0072ce"/>
  <line x1="385" y1="300" x2="385" y2="500" stroke="#0072ce" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="300" x2="385" y2="300" stroke="#0072ce" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="395" y="290" font-size="13" font-weight="700" fill="#0072ce">Equilibrium</text>
  <text x="385" y="520" font-size="12" text-anchor="middle" fill="#0072ce">Qe</text>
  <text x="85" y="304" font-size="12" text-anchor="end" fill="#0072ce">Pe</text>

  <text x="400" y="565" font-size="13" text-anchor="middle" fill="#888">The market forces that determine price: where the willingness to sell meets the willingness to buy.</text>
</svg>
