<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a2e">Porter's Five Forces</text>

  <!-- Center box -->
  <rect x="290" y="255" width="220" height="90" rx="8" fill="#0072ce" stroke="#004c8c" stroke-width="2"/>
  <text x="400" y="290" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Industry</text>
  <text x="400" y="312" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Competitive Rivalry</text>

  <!-- Top: New Entrants -->
  <rect x="290" y="80" width="220" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#2e7d32">Threat of</text>
  <text x="400" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#2e7d32">New Entrants</text>
  <line x1="400" y1="150" x2="400" y2="255" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: Substitutes -->
  <rect x="290" y="450" width="220" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="400" y="480" font-size="14" font-weight="700" text-anchor="middle" fill="#e65100">Threat of</text>
  <text x="400" y="498" font-size="14" font-weight="700" text-anchor="middle" fill="#e65100">Substitute Products</text>
  <line x1="400" y1="450" x2="400" y2="345" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left: Supplier Power -->
  <rect x="40" y="265" width="200" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Bargaining Power</text>
  <text x="140" y="313" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">of Suppliers</text>
  <line x1="240" y1="300" x2="290" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Buyer Power -->
  <rect x="560" y="265" width="200" height="70" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="660" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#c62828">Bargaining Power</text>
  <text x="660" y="313" font-size="14" font-weight="700" text-anchor="middle" fill="#c62828">of Buyers</text>
  <line x1="560" y1="300" x2="510" y2="300" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="400" y="565" font-size="13" text-anchor="middle" fill="#888">A model for analyzing the competitive forces that shape an industry's profitability.</text>
</svg>
